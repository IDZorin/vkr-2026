# Generic primitive tokens — слова без доменного смысла, чисто
# структурные/количественные.
#
# ============================================================
#  INTERNAL ONLY — никогда не включать в LLM-промпт.
# ============================================================
#
# Этот файл существует **исключительно** для пост-обработки в детекторах
# и лайнтерах: чтобы при проверке вроде `canonical_subterm_reuse_gap` или
# `composite_identifier_crosslink_gap` не флагать имена, состоящие только
# из generic-primitives, как требующие «структурной связи с другим
# концептом».
#
# Если этот список попадёт в LLM-промпт, модель выучит его как «можно
# лепить эти слова где угодно» и начнёт ими злоупотреблять. Это против
# принципа «LLM использует только токены из текста / methodology / overlay
# / user_hint».
#
# Правило допуска токена в этот список:
#   1. Слово несёт количественную/структурную, а не доменную семантику.
#   2. Встречается в любом домене, не только в финансовых индексах.
#   3. Не несёт смысла само по себе — нужно прилагательное/носитель.
#
# Не путать с Prelude: Prelude (см. ../../index/minimal_prelude_v1.json) —
# авторитетная общая онтология, **показывается** в LLM-контексте как
# разрешённый источник имён. Generic primitives — это про шкалы и
# счётчики, не про сущности.

primitives:
  - value
  - count
  - mass
  - ratio
  - rate
  - share
  - score
  - flag
  - total
  - amount
  - sum
  - average
  - percentage
  - proportion
