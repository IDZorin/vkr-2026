vocabulary_notes:
  Delo:
    source_phrase: case / legal situation
    note: 'Local carrier for a concrete legal event or dispute. It scopes actors, facts, payments, penalties,
      and procedural consequences.

      '
  obyazan_uplatit:
    source_phrase: платить / должен платить / уплатить
    note: 'Payment-duty carrier. The source often states payment consequences article by article; this
      relation keeps payer, recipient where present, monetary unit, and amount explicit.

      '
  obyazan_uplatit_bez_poluchatelya:
    source_phrase: платить / уплатить
    note: 'Payment-duty carrier used when the source specifies payer, unit, and amount, but does not explicitly
      name a recipient.

      '
  shtraf:
    source_phrase: штраф
    note: 'Penalty carrier for monetary fines in the source.

      '
  vzyiskivaetsya_s:
    source_phrase: взыскивается с
    note: 'Recovery/liability carrier preserving the source''s passive collection wording.

      '
  zapresheno_otobrat_vesh:
    source_phrase: нельзя отобрать
    note: 'Positive carrier for a prohibition; contradiction checks can inspect the explicit prohibition
      predicate rather than relying only on a negative word inside the relation name.

      '
  razresheno_otobrat_cheloveka:
    source_phrase: может отобрать
    note: 'Permission-like carrier preserving source wording where a person may take back a dependent
      person.

      '
  Verv:
    source_phrase: вервь
    note: 'Local social-group sort preserved from the historical source.

      '
  Lyudi:
    source_phrase: люди
    note: 'Local collective-person sort; linked to individual people through `chelovek_v_lyudyah`.

      '
  DenezhnayaEdinitsa:
    source_phrase: гривна / резана / куна / ногата / веверица
    note: 'Monetary-unit enum covering the units used by the excerpt.

      '
