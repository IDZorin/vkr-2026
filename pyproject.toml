[project]
name = "a4v3-ir-toolkit"
version = "0.1.0"
description = "Curated public toolkit for parsing, linting, tracing, and checking A4V3 IR artifacts."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
reasoning = [
    "z3-solver>=4.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
all = [
    "a4v3-ir-toolkit[reasoning,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
a4v3-toolkit = "a4v3_ir_toolkit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["a4v3_ir_toolkit"]

[tool.ruff]
target-version = "py310"
line-length = 100
