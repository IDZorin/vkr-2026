section: "N04 Definition: Business Day"
source_file: "source.md"
schema_version: "v2"

ir_files:
  main: "main_ir.a4v3"

claims:

  business_day_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Business Day\" is every weekday from Monday to Friday."
    back_translation: >
      For every day, that day is a Business Day if and only if the weekday
      of that day is Monday, Tuesday, Wednesday, Thursday, or Friday.
    vocabulary_basis: source_only
    status: covered
    notes: >
      Pure definitional claim. The source phrase "from Monday to Friday" is
      expanded into the five weekday values included by that range. Tuesday,
      Wednesday, and Thursday are therefore implicit source content, not new
      methodology claims. The biconditional is used because the source states
      the definition of "Business Day", not only a sufficient condition.

uncovered_source:
  - quote: "(none -- the single source sentence is the single IR claim)"

vocabulary_notes:
  business_day:
    note: >
      IR predicate for the source term "Business Day" (quoted in source as
      the term being defined). Back-translation uses the spaced source phrase
      "Business Day", not the IR identifier.
  WeekdayOf:
    note: >
      Prelude function from Day to Weekday. Used to make the "weekday"
      component explicit instead of hiding it in the predicate name.
  Monday:
    note: >
      Prelude weekday entity matching the source phrase "Monday".
  Tuesday:
    note: >
      Prelude weekday entity included by the source range "from Monday to
      Friday".
  Wednesday:
    note: >
      Prelude weekday entity included by the source range "from Monday to
      Friday".
  Thursday:
    note: >
      Prelude weekday entity included by the source range "from Monday to
