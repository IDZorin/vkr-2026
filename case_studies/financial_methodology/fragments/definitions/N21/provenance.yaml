section: "N21 Definition: Index Currency"
source_file: "source.md"
schema_version: "v2"

ir_files:
  main: "main_ir.a4v3"

claims:

  currency_column_in_section_1_2_table:
    kind: fact
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Index Currency\" is the currency specified in the column \"Currency\" in the table in Section 1.2."
    back_translation: >
      The Currency column belongs to the table in Section 1.2.
    vocabulary_basis: source_only
    status: covered
    notes: >
      This fact captures the cross-reference target in the source phrase
      "the column \"Currency\" in the table in Section 1.2". The actual
      rows and concrete currency values from Section 1.2 are not imported
      into this short definition; cross-section alignment belongs to the
      bridge/merge layer.

  index_currency_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Index Currency\" is the currency specified in the column \"Currency\" in the table in Section 1.2."
    back_translation: >
      For every Index and currency, that currency is the Index Currency of
      the Index if and only if there is a specification for that Index
      whose currency is that currency, whose column is the Currency column,
      and whose table is the table in Section 1.2.
    vocabulary_basis: source_only
    status: covered
    notes: >
      Pure definitional claim. The biconditional is used because the source
      defines the term "Index Currency". The reified specification object
      keeps the source table-column link inside the formula body while
      avoiding a high-arity table-row-column relation.

uncovered_source:
  - quote: "(none -- the single source sentence maps to the fact and definition constraint)"

