section: "N13 Definition: Free Float Market Capitalization"
source_file: "source.md"
schema_version: "v2"

ir_files:
  main: "main_ir.a4v3"

claims:

  free_float_market_capitalization_calculated_as_multiplication_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "The \"Free Float Market Capitalization\" is with regard to each of the securities fulfilling the Index Component Requirements on a Selection Day the share class-specific free float market capitalization. It is calculated as the multiplication of the shares outstanding in Free Float (as sourced from data vendors) with the Closing Price of the share class as of the respective Selection Day."
    back_translation: >
      For every Selection Day and security that fulfills the Index Component
      Requirements, the Free Float Market Capitalization is the shares
      outstanding in Free Float of that security's share class multiplied by
      the Closing Price of that share class as of the Selection Day, and the
      shares outstanding in Free Float are sourced from a data vendor.
    vocabulary_basis: source_only
    status: covered
    notes: >
      The source verb "is calculated as the multiplication" is represented
      by the definitional product equation. "Share class-specific" is
      preserved by projecting the security to its share class and keying
      both share-count and closing-price functions on the share class. The
      plural "data vendors" is represented as an existential over DataVendor.

