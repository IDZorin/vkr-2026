claims:

  daily_value_traded_product_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Daily Value Traded\" means, in respect of an Index Component and a Trading Day, the product of (i) the Closing Price of such Index Component and (ii) the volume traded (measured as a number of shares) of such Index Component on the Exchange during such Trading Day."
    back_translation: >
      For every Index Component and Trading Day, the Daily Value Traded is
      the Closing Price of that Index Component multiplied by the volume
      traded measured as a number of shares of that Index Component on the
      Exchange of that Index Component during that Trading Day.
    vocabulary_basis: source_only
    status: covered
    notes: >
      The source verb "means" is legal-definition glue and is represented by
      the definitional equality rather than a separate ontology predicate.
      "On the Exchange during such Trading Day" is captured by the qualified
      function `volume_traded_on_exchange_during_trading_day(c, exchange, d)`.

