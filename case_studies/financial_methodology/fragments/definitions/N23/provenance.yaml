section: "N23 Definition: Index Universe"
source_file: "source.md"
schema_version: "v2"

ir_files:
  main: "main_ir.a4v3"

claims:

  index_universe_sum_source_phrase:
    kind: fact
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Index Universe\" is the sum of all financial instruments which fulfill the Index Universe Requirements."
    back_translation: >
      The Index Universe is the sum of all financial instruments that
      fulfill the Index Universe Requirements.
    vocabulary_basis: source_only
    status: covered
    notes: >
      This fact preserves the source phrase "sum of all" as a descriptive
      collection marker. The actual membership semantics are provided by
      the biconditional constraint below; "sum" is not interpreted as
      numeric addition.

  index_universe_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Index Universe\" is the sum of all financial instruments which fulfill the Index Universe Requirements."
    back_translation: >
      For every financial instrument, that financial instrument is in the
      Index Universe if and only if it fulfills the Index Universe
      Requirements.
    vocabulary_basis: source_only
    status: covered
    notes: >
      Pure definitional claim. The biconditional is used because the source
      defines the term "Index Universe". The phrase "all financial
      instruments" is represented by universal quantification over
      FinancialInstrument. The phrase "which fulfill the Index Universe
      Requirements" is represented by the requirement-fulfillment predicate.

uncovered_source:
  - quote: "(none -- the single source sentence maps to the fact and definition constraint)"

