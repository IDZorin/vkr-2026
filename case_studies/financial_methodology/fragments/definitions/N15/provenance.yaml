    notes: >
      Pure definitional claim. The biconditional is used because the source
      defines the term "Gbs Index Component". The phrase "each security" is
      represented by universal quantification over Security. The phrase
      "reflected in the GBS Index" is kept as a separate predicate rather
      than hidden in the name `gbs_index_component`.

