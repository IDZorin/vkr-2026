section: "N01 Definition: Average Daily Value Traded"
source_file: "source.md"
schema_version: "v2"

ir_files:
  main: "main_ir.a4v3"

claims:

  daily_value_traded_sum_over_period_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Average Daily Value Traded\" means, in respect of an Index Component, the sum of Daily Value Traded over the specified period divided by the number of TRADING DAYS that fall in the specified period."
    back_translation: >
      For every Index Component and specified period, the sum of Daily Value
      Traded over that specified period is the aggregate of Daily Value Traded
      over Trading Days that fall in that specified period.
    vocabulary_basis: source_only
    status: covered
    notes: >
      This claim captures the numerator of the source formula. The phrase
      "in respect of" is legal scope glue and is represented by the Index
      Component parameter.

  trading_day_count_in_period_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Average Daily Value Traded\" means, in respect of an Index Component, the sum of Daily Value Traded over the specified period divided by the number of TRADING DAYS that fall in the specified period."
    back_translation: >
      For every specified period, the number of Trading Days in that specified
      period is the count of Trading Days that fall in that specified period.
    vocabulary_basis: source_only
    status: covered
    notes: >
      This claim captures the denominator phrase "the number of TRADING DAYS
      that fall in the specified period".

  average_daily_value_traded_divided_by_trading_day_count_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Average Daily Value Traded\" means, in respect of an Index Component, the sum of Daily Value Traded over the specified period divided by the number of TRADING DAYS that fall in the specified period."
    back_translation: >
      For every Index Component and specified period, Average Daily Value
      Traded is the sum of Daily Value Traded over the specified period divided
      by the number of Trading Days that fall in the specified period.
    vocabulary_basis: source_only
    status: covered
    notes: >
      Pure definitional formula. The source verb "means" is legal-definition
      glue and is represented by the definitional equality rather than a
      separate ontology predicate.

uncovered_source:
  - quote: "(none -- source formula is covered by the three constraints; legal glue is documented in notes/waiver)"

