  exchange_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Exchange\" is with respect to the Index and every Index Component, the respective exchange where the Index Component has its listing as determined in accordance with the rules in Section 2."
    back_translation: >
      For every Index Component, there is a listing of that Index Component
      determined in accordance with the rules in Section 2, and the respective
      Exchange for the Index and that Index Component is the exchange of that
      listing.
    vocabulary_basis: source_only
    status: covered
    notes: >
      The source phrase "with respect to the Index and every Index Component"
      is represented by the Index and Index Component parameters. The source
      word "where" is relative-clause glue linking the listing to its exchange.

