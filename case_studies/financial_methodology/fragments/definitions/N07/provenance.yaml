section: "N07 Definition: Closing Price"
source_file: "source.md"
schema_version: "v2"

ir_files:
  main: "main_ir.a4v3"

claims:

  closing_price_definition_when_published:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "The \"Closing Price\" in respect of an Index Component and a Trading Day is a security's final regular-hours Trading Price published by the Exchange and determined in accordance with the Exchange regulations."
    back_translation: >
      For every Index Component and Trading Day, when a Closing Price is
      available from the Exchange, that Closing Price is the final
      regular-hours Trading Price of the Index Component, is published by the
      Exchange of that Index Component, is determined, and is in accordance
      with both the Exchange rules and the Exchange regulations.
    vocabulary_basis: source_only
    status: covered
    notes: >
      The source distinguishes "Exchange regulations" (determination) from
      "Exchange rules" (publication, mentioned in the fallback). Both
      accordance properties are conjoined in the published case because the
      fallback fires only when publication is not in accordance with the
      Exchange rules.

  last_trading_price_used_when_closing_price_not_published:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "If the Exchange has no or has not published a Closing Price in accordance with the Exchange rules for an Index Component, the last Trading Price will be used."
    back_translation: >
      For every Index Component and Trading Day, when no Closing Price is
      available from the Exchange, the Closing Price is the last Trading
      Price of that Index Component on that Trading Day.
    vocabulary_basis: source_only
    status: covered
    notes: >
      The source disjunction "has no or has not published ... in accordance
      with the Exchange rules" is compressed into the single negative
      condition not closing_price_available; both source sub-cases lead to
      the same fallback outcome.

uncovered_source:
  - quote: "(none -- source definition is covered)"

