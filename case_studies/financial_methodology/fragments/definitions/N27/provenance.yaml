    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "\"Selection Day\" is 20 Business Days before the Rebalance Day, disregarding any change of the Rebalance Day."
    back_translation: >
      For every Selection Day for a Rebalance Day, any change of that
      Rebalance Day is disregarded for the Selection Day definition.
    vocabulary_basis: source_only
    status: covered
    notes: >
      The "disregarding any change" phrase is modeled as a separate
      implication rather than as a condition that distinguishes Selection Days.

