section: "N12 Definition: Free Float"
source_file: "source.md"
schema_version: "v2"

ir_files:
  main: "main_ir.a4v3"

claims:

  free_float_definition:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "The \"Free Float\" is with regard to each of the securities fulfilling the Index Component Requirements on a Selection Day the share class-specific fraction of the total number of shares of such share class issued that are available for trading by market participants and not locked-in by long term holders, as sourced from data vendors."
    back_translation: >
      For every Selection Day and security that fulfills the Index Component
      Requirements, the Free Float numerator is the count of shares of that
      security's share class that have been issued as of the Selection Day,
      are available for trading by market participants, and are not locked-in
      by long term holders; the Free Float denominator is the count of shares
      of that share class that have been issued as of the Selection Day; the
      Free Float is the numerator divided by the denominator; and the Free
      Float is sourced from a data vendor.
    vocabulary_basis: source_only
    status: covered
    notes: >
      The source describes a single fraction; the IR splits it into typed
      numerator and denominator share-counts so the "share class-specific
      fraction" can be machine-checked against the four share-level
      conditions named in the source. The plural "data vendors" is
      represented as an existential over DataVendor since the source asserts
      at least one such vendor as the source.

uncovered_source:
  - quote: "(none -- source definition is covered)"

