  ExtraordinaryRebalance:
    note: >
      Subtype for the source phrase "rebalanced extraordinarily".
    source_phrase: "rebalanced extraordinarily"
  rebalance_of_index:
    note: >
      Positive relation used as the carrier for rebalance events of an index.
      The negative source claim is represented by `not rebalance_of_index(...)`
      rather than by hiding "not" in the relation name.
    source_phrase: "Index is ... rebalanced"
