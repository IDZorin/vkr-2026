claims:

  index_not_rebalanced_extraordinarily:
    kind: constraint
    ir_origin_file: "main_ir.a4v3"
    claim_origin: source_claim
    source_quotes:
      - "The Index is not rebalanced extraordinarily."
    back_translation: >
      The Index has no extraordinary rebalance.
    vocabulary_basis: source_only
    status: covered
    notes: >
      The source is encoded as a hard negative constraint, not as a deontic
      prohibition. The positive relation `rebalance_of_index` remains explicit
      and the negation appears in the formula body, so a later claim asserting
      an extraordinary rebalance of the Index can be detected as a contradiction.

