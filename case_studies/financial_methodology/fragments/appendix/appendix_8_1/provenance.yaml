vocabulary_notes:
  Appendix8:
    note: >
      Local entity for the appendix document (Appendix 8 of the source
      Guideline). Cross-section bridged to section_2_1's
      IndexGuidelineAppendix entity in bridge/main_bridge.a4v3.
  RBICS:
    note: >
      Local entity for the source's "RBICS" abbreviation (FactSet
      Revere Business Industry Classification System).
      Cross-section bridged to section_2_1's
      FactSetRevereBusinessIndustryClassificationSystem entity.
  RbicsSubindustry:
    note: >
      Local sort for level-6 RBICS sub-industry classifications.
      Cross-section bridged to section_2_1's RBICSSubindustryClassification.
      Each appendix row populates one entity of this sort, named
      by the 12-digit code (without commas, e.g. RbicsSubindustry101025153010).
  RbicsNumberCode:
    note: >
      Local sort for RBICS Number codes. Encoded as named entities (one per
      unique 12-digit code) rather than as Nat / String, since the codes are
      opaque identifiers and structural equality is sufficient. Source
      formatting (commas every 3 digits) is dropped from the entity name
      but preserved in provenance back_translation.
  RbicsSubindustryName:
    note: >
      Local sort for RBICS Subindustry Names. Encoded as named entities (one
      per unique source name) rather than as String, since the names are
      opaque labels and structural equality is sufficient. Source punctuation
      (periods in "Alt.", parentheses in "(RVs)", slashes in "Asia/Pacific")
      is dropped from the CamelCase entity name; verbatim source phrasing is
      preserved in provenance back_translation.
  RbicsClassificationLevel:
    note: >
      Singleton enum with one declared value RbicsClassificationLevel6,
      since this appendix only enumerates Sub-Industry (Level 6) entries.
      The RBICS hierarchy has six levels in total (Economy, Sector,
      Sub-Sector, Industry Group, Industry, Sub-Industry); levels 1-5 are
      not modeled here because the source does not enumerate them.
      Singleton-for-extensibility pattern: the schema accommodates other
      levels if a future appendix populates them.
